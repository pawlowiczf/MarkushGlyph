[project]
name = "markushglyph"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "glyph[ocsr,markush,train] @ git+https://github.com/EdisonScientific/glyph",
    "jupyterlab",
    "ipykernel",
    "ipywidgets",
    "matplotlib",
    "polars>=2.0.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
